name: Testes PHP e MySQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jif_plus
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Verificar sintaxe PHP
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Preparar banco pelo instalador documentado
        run: |
          cat > .env <<'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=jif_plus
          DB_USER=root
          DB_PASS=root
          DB_CHARSET=utf8mb4
          EOF
          php database/setup.php

      - name: Testar conexão e tabelas
        env:
          APP_ENV: production
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: jif_plus
          DB_USER: root
          DB_PASS: root
          DB_CHARSET: utf8mb4
        run: php tests/test_db_connection.php

      - name: Testar autenticação e RBAC
        env:
          APP_ENV: production
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: jif_plus
          DB_USER: root
          DB_PASS: root
          DB_CHARSET: utf8mb4
        run: php tests/test_auth.php

      - name: Testar critérios de aceite CA01 a CA17
        env:
          APP_ENV: production
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: jif_plus
          DB_USER: root
          DB_PASS: root
          DB_CHARSET: utf8mb4
        run: php tests/test_full_suite.php